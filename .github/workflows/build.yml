name: Build U-Boot for A31s

on:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf device-tree-compiler
      
      - name: Apply MARS-A31s U-Boot patches
        run: bash tools/mars-a31s/uboot-nand.sh apply --up-to 3

      - name: Build
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- Sinlinx_SinA31s_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc)

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-a31s
          path: u-boot-sunxi-with-spl.bin
