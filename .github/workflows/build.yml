name: Build U-Boot for A31s

on:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf device-tree-compiler
      
      - name: Apply MARS-A31s U-Boot patches
        env:
          MARS_NAND_PAGE_SIZE: "0x2000"
          MARS_NAND_OOBSIZE: "0x1C0"
          MARS_NAND_BLOCK_SIZE: "0x200000"
        run: bash tools/mars-a31s/uboot-nand.sh apply --up-to 3

      - name: Build
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- Sinlinx_SinA31s_defconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc)
          grep -E 'CONFIG_(NAND_SUNXI|MTD_RAW_NAND|CMD_NAND|SPL_NAND_SUPPORT|SYS_NAND_U_BOOT_OFFS)=' .config
          dtc -I dtb -O dts arch/arm/dts/sun6i-a31s-sina31s.dtb | grep -B18 -A18 -E 'nand@1c03000|cap-mmc-hw-reset'
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-a31s
          path: |
            u-boot-sunxi-with-spl.bin
            u-boot-dtb.bin
            spl/sunxi-spl.bin
            spl/sunxi-spl-with-ecc.bin
            .config
